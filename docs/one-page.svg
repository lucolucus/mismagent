<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>mismAgent 0.7 on one page</title>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .soft { fill: #59636e; }
    .line { stroke: #8c959f; fill: none; stroke-width: 1.8; }
    .rule { stroke: #d1d9e0; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.4; }
    .doc { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.4; }
    .ring { stroke: #0969da; fill: none; stroke-width: 2.4; }
    .node { fill: #ffffff; stroke: #0969da; stroke-width: 1.8; }
    .you { fill: #1a7f37; }
    .youbox { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.4; }
    .arrowhead { fill: #8c959f; }
    .ringhead { fill: #0969da; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .soft { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .rule { stroke: #30363d; }
      .box { fill: #161b22; stroke: #3d444d; }
      .doc { fill: #0c2d6b; stroke: #388bfd; }
      .ring { stroke: #4493f8; }
      .node { fill: #0d1117; stroke: #4493f8; }
      .you { fill: #3fb950; }
      .youbox { fill: #0f2e1a; stroke: #2ea043; }
      .arrowhead { fill: #6e7681; }
      .ringhead { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ringhead"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="660"/>

  <!-- Title: why this page exists -->
  <text class="ink" x="32" y="56" font-size="28" font-weight="700">Coding agents that write software that stays maintainable</text>
  <text class="soft" x="32" y="88" font-size="16">mismAgent, a Claude Code plugin · v0.7 · 2026-10-07</text>
  <line class="rule" x1="32" y1="110" x2="928" y2="110"/>

  <!-- From an idea to examples -->
  <text class="soft" x="145" y="148" font-size="15" text-anchor="middle">a new idea</text>
  <line class="line" x1="145" y1="154" x2="145" y2="166" marker-end="url(#a)"/>
  <rect class="box" x="40" y="168" width="210" height="76" rx="9"/>
  <text class="ink" x="145" y="194" font-size="17" font-weight="600" text-anchor="middle">explore</text>
  <text class="soft" x="145" y="214" font-size="14" text-anchor="middle">a challenger tries</text>
  <text class="soft" x="145" y="232" font-size="14" text-anchor="middle">to kill the idea</text>
  <circle class="you" cx="250" cy="168" r="6"/>

  <line class="line" x1="145" y1="244" x2="145" y2="284" marker-end="url(#a)"/>
  <text class="soft" x="155" y="270" font-size="13">or start with a request</text>

  <rect class="box" x="40" y="286" width="210" height="76" rx="9"/>
  <text class="ink" x="145" y="312" font-size="17" font-weight="600" text-anchor="middle">specify</text>
  <text class="soft" x="145" y="332" font-size="14" text-anchor="middle">real cases, real values;</text>
  <text class="soft" x="145" y="350" font-size="14" text-anchor="middle">you confirm each rule</text>
  <circle class="you" cx="250" cy="286" r="6"/>

  <line class="line" x1="145" y1="362" x2="145" y2="384" marker-end="url(#a)"/>
  <rect class="doc" x="40" y="386" width="210" height="56" rx="5"/>
  <text class="ink" x="145" y="410" font-size="16" font-weight="600" text-anchor="middle">examples + slices</text>
  <text class="soft" x="145" y="430" font-size="14" text-anchor="middle">for one release</text>
  <path class="line" d="M250,414 C295,414 315,390 344,372" marker-end="url(#a)"/>

  <!-- The build ring -->
  <circle class="ring" cx="480" cy="360" r="130" stroke-opacity="0.15" stroke-width="24"/>
  <path class="ring" d="M548.9,249.8 A130,130 0 0 1 609.8,366.8" marker-end="url(#r)"/>
  <path class="ring" d="M550.8,469.0 A130,130 0 0 1 409.2,469.0" marker-end="url(#r)"/>
  <path class="ring" d="M350.2,366.8 A130,130 0 0 1 411.1,249.8" marker-end="url(#r)"/>
  <text class="soft" x="480" y="190" font-size="14" text-anchor="middle">acceptance tests first · TDD · refactor</text>
  <rect class="node" x="420" y="210" width="120" height="40" rx="20"/>
  <text class="ink" x="480" y="236" font-size="17" font-weight="600" text-anchor="middle">builder</text>
  <rect class="node" x="533" y="405" width="120" height="40" rx="20"/>
  <text class="ink" x="593" y="431" font-size="17" font-weight="600" text-anchor="middle">reviewer</text>
  <rect class="node" x="307" y="405" width="120" height="40" rx="20"/>
  <text class="ink" x="367" y="431" font-size="17" font-weight="600" text-anchor="middle">land</text>
  <text class="ink mono" x="480" y="338" font-size="16" font-weight="600" text-anchor="middle">/mismagent:build</text>
  <text class="soft" x="480" y="362" font-size="14" text-anchor="middle">one slice at a time,</text>
  <text class="soft" x="480" y="380" font-size="14" text-anchor="middle">one action per call</text>
  <text class="soft" x="662" y="420" font-size="14">a quality defect blocks</text>
  <text class="soft" x="662" y="438" font-size="14">like a functional one</text>

  <!-- Architect -->
  <path class="line" d="M593,295 C640,262 680,244 716,240" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="box" x="718" y="196" width="202" height="76" rx="9"/>
  <text class="ink" x="819" y="222" font-size="17" font-weight="600" text-anchor="middle">architect</text>
  <text class="soft" x="819" y="242" font-size="14" text-anchor="middle">structure at birth,</text>
  <text class="soft" x="819" y="260" font-size="14" text-anchor="middle">design passes on signal</text>

  <!-- Conventions -->
  <path class="line" d="M630,447 C660,490 690,512 716,516" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="youbox" x="718" y="478" width="202" height="76" rx="9"/>
  <text class="ink" x="819" y="504" font-size="17" font-weight="600" text-anchor="middle">conventions</text>
  <text class="soft" x="819" y="524" font-size="14" text-anchor="middle">agents propose,</text>
  <text class="soft" x="819" y="542" font-size="14" text-anchor="middle">you decide each one</text>
  <circle class="you" cx="920" cy="478" r="6"/>

  <!-- Release -->
  <line class="line" x1="480" y1="492" x2="480" y2="510" marker-end="url(#a)"/>
  <rect class="youbox" x="380" y="512" width="200" height="42" rx="21"/>
  <text class="ink" x="480" y="539" font-size="17" font-weight="600" text-anchor="middle">release R0 · R1 · …</text>
  <circle class="you" cx="580" cy="512" r="6"/>
  <text class="soft" x="480" y="580" font-size="14" text-anchor="middle">a fresh reviewer scores seven dimensions 1–5; any below 4, a design pass;</text>
  <text class="soft" x="480" y="598" font-size="14" text-anchor="middle">still below after two, you decide</text>

  <!-- Legend -->
  <line class="rule" x1="32" y1="620" x2="928" y2="620"/>
  <circle class="you" cx="46" cy="641" r="6"/>
  <text class="soft" x="60" y="646" font-size="14">you decide here · a doubt the agents cannot settle stops the flow (NEEDS-HUMAN)</text>
</svg>
